[project]
name = "gym-tg-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gym-tg-bot = "gym_tg_bot:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100,
target-vision = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true, python_version = "3.12", mypy_path = "src", explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto",
testpaths = ["tests"],
pythonpath = ["src"]